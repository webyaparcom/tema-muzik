<section class="modulex-tanitim-sekmeli{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-tanitim-sekmeli-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* tanitim-sekmeli — Vizyon/misyon gibi maddeler aynı anda değil sekmelerle gösterilir; module-1'in yan yana kutularına etkileşimli alternatif. */
  .modulex-tanitim-sekmeli { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-tanitim-sekmeli *, .modulex-tanitim-sekmeli *::before, .modulex-tanitim-sekmeli *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-tanitim-sekmeli :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-tanitim-sekmeli :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-tanitim-sekmeli :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-tanitim-sekmeli :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-tanitim-sekmeli img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-tanitim-sekmeli) img { height: auto; }
  .modulex-tanitim-sekmeli [hidden] { display: none !important; }
  .modulex-tanitim-sekmeli :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-tanitim-sekmeli :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-tanitim-sekmeli-ic { max-width: --max--; margin-inline: auto; }
  .modulex-tanitim-sekmeli-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-tanitim-sekmeli--bassiz .modulex-tanitim-sekmeli-bas { display: none; }
  .modulex-tanitim-sekmeli-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-tanitim-sekmeli-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-tanitim-sekmeli-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-tanitim-sekmeli-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-tanitim-sekmeli-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-tanitim-sekmeli-dugme:hover { transform: translateY(-2px); }
  .modulex-tanitim-sekmeli-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-tanitim-sekmeli-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-tanitim-sekmeli-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-tanitim-sekmeli-duzen { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(32px, 5vw, 80px); align-items: center; }
  .modulex-tanitim-sekmeli-duzen--tek { grid-template-columns: minmax(0, 1fr); max-width: 800px; }
  .modulex-tanitim-sekmeli-yazi { display: grid; gap: 18px; }
  .modulex-tanitim-sekmeli-sekmeler { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 999px; background: --bg--; justify-self: start; }
  .modulex-tanitim-sekmeli:not(.modulex-tanitim-sekmeli--js) .modulex-tanitim-sekmeli-sekmeler { display: none; }
  .modulex-tanitim-sekmeli-sekme { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: 0; border-radius: 999px; background: transparent; color: --muted--; font: inherit; font-weight: 700; transition: background 0.25s ease, color 0.25s ease; }
  .modulex-tanitim-sekmeli-sekme[aria-selected="true"] { background: --accent--; color: --accentText--; }
  .modulex-tanitim-sekmeli-sikon { font-size: 20px; }
  .modulex-tanitim-sekmeli-paneller { display: grid; gap: 12px; }
  .modulex-tanitim-sekmeli-panel { display: grid; gap: 8px; padding: 22px 24px; border-inline-start: 4px solid --accent--; border-radius: 0 14px 14px 0; background: --bg--; animation: modulex-tanitim-sekmeli-gel 0.4s ease both; }
  [dir="rtl"] .modulex-tanitim-sekmeli-panel { border-radius: 14px 0 0 14px; }
  .modulex-tanitim-sekmeli-gorsel { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: calc(--yuvarlak-- * 1.4); }
  @keyframes modulex-tanitim-sekmeli-gel { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-tanitim-sekmeli-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-tanitim-sekmeli-sekmeler { border-radius: 18px; }
  }
  .modulex-tanitim-sekmeli-bag { color: inherit; text-decoration: none; }
  .modulex-tanitim-sekmeli-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-tanitim-sekmeli-mbaslik { font-size: 1.05rem; font-weight: 700; }
  .modulex-tanitim-sekmeli-mmetin { color: --muted--; font-size: 0.95rem; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-tanitim-sekmeli :is(.modulex-tanitim-sekmeli-baslik, .modulex-tanitim-sekmeli-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-tanitim-sekmeli-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-tanitim-sekmeli { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-tanitim-sekmeli *, .modulex-tanitim-sekmeli *::before, .modulex-tanitim-sekmeli *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-tanitim-sekmeli";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
