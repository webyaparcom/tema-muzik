<style>
  /* sayac-dama — Görsel ritmi zemin dönüşümü kurar (satranç tahtası); kare oran ve ortalanmış dev rakamla poster etkisi. */
  .modulex-sayac-dama { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-dama *, .modulex-sayac-dama *::before, .modulex-sayac-dama *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-dama :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-dama :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-dama :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-dama :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-dama img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-dama) img { height: auto; }
  .modulex-sayac-dama [hidden] { display: none !important; }
  .modulex-sayac-dama :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-dama :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-dama-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-dama-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-dama--bassiz .modulex-sayac-dama-bas { display: none; }
  .modulex-sayac-dama-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-dama-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-dama-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-dama-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-sayac-dama-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-dama-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-dama-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-dama-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-dama-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-dama-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-dama-tahta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .modulex-sayac-dama-kare { display: grid; place-content: center; justify-items: center; gap: 8px; aspect-ratio: 1; padding: 16px; text-align: center; border: 2px solid --text--; margin: -1px; transition: background 0.3s ease, color 0.3s ease; }
  .modulex-sayac-dama-kare:nth-child(odd) { background: --vurguBg--; color: --vurguText--; border-color: --vurguBg--; }
  .modulex-sayac-dama-kare:nth-child(odd):hover { background: transparent; color: --text--; border-color: --text--; }
  .modulex-sayac-dama-kare:nth-child(even):hover { background: --text--; color: --bg--; }
  .modulex-sayac-dama-sayi { font-size: clamp(2rem, 4.4vw, 3.6rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
  .modulex-sayac-dama-ek { font-size: 0.5em; }

  @media (max-width: 1024px) {
    .modulex-sayac-dama-tahta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .modulex-sayac-dama-kare:nth-child(4n + 3), .modulex-sayac-dama-kare:nth-child(4n + 4) { background: transparent; color: --text--; border-color: --text--; }
    .modulex-sayac-dama-kare:nth-child(4n + 3) { background: --vurguBg--; color: --vurguText--; border-color: --vurguBg--; }
    .modulex-sayac-dama-kare:nth-child(4n + 4) { background: transparent; }
    .modulex-sayac-dama-kare:nth-child(4n + 1) { background: --vurguBg--; }
    .modulex-sayac-dama-kare:nth-child(4n + 2) { background: transparent; color: --text--; border-color: --text--; }
  }
  @media (max-width: 768px) {
    .modulex-sayac-dama-kare { aspect-ratio: 1.1; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-dama :is(.modulex-sayac-dama-baslik, .modulex-sayac-dama-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-dama-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-dama { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-dama *, .modulex-sayac-dama *::before, .modulex-sayac-dama *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-dama";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sayac(s, P, az);
    });
  })();
</script>
