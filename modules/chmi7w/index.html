<section class="modulex-yorum-portre-ray{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-yorum-portre-ray-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* yorum-portre-ray — Yüz önce: portre kartın yarısını kaplar, kişi kimliği alıntıdan baskın — avatar küçük kart ızgarasının tersi. */
  .modulex-yorum-portre-ray { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-yorum-portre-ray *, .modulex-yorum-portre-ray *::before, .modulex-yorum-portre-ray *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-yorum-portre-ray :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-yorum-portre-ray :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-yorum-portre-ray :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-yorum-portre-ray :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-yorum-portre-ray img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-yorum-portre-ray) img { height: auto; }
  .modulex-yorum-portre-ray [hidden] { display: none !important; }
  .modulex-yorum-portre-ray :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-yorum-portre-ray :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-yorum-portre-ray-ic { max-width: --max--; margin-inline: auto; }
  .modulex-yorum-portre-ray-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-yorum-portre-ray--bassiz .modulex-yorum-portre-ray-bas { display: none; }
  .modulex-yorum-portre-ray-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-yorum-portre-ray-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-yorum-portre-ray-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-yorum-portre-ray-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-yorum-portre-ray-ust { grid-column: 1 / -1; }
  .modulex-yorum-portre-ray-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-yorum-portre-ray-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-yorum-portre-ray-dugme:hover { transform: translateY(-2px); }
  .modulex-yorum-portre-ray-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-yorum-portre-ray-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-yorum-portre-ray-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-yorum-portre-ray-ad { font-weight: 700; }
  .modulex-yorum-portre-ray-kisi { display: grid; gap: 2px; min-width: 0; }
  .modulex-yorum-portre-ray-unvan { color: --muted--; font-size: 0.88rem; line-height: 1.45; }
  .modulex-yorum-portre-ray-puan { display: flex; gap: 2px; color: --yildiz--; }
  .modulex-yorum-portre-ray-puan .material-symbols-outlined { font-size: 20px; font-variation-settings: "FILL" 1; }
  .modulex-yorum-portre-ray-yildiz--bos { opacity: 0.3; }
  .modulex-yorum-portre-ray-avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
  .modulex-yorum-portre-ray-harf { display: inline-grid; place-items: center; background: color-mix(in srgb, --accent-- 18%, --kartBg--); color: --accentInk--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-yorum-portre-ray-yazar { display: flex; align-items: center; gap: 12px; }

  .modulex-yorum-portre-ray-ray { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 330px); gap: 20px; padding-block-end: 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .modulex-yorum-portre-ray-ray::-webkit-scrollbar { display: none; }
  .modulex-yorum-portre-ray-kart { display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-radius: --yuvarlak--; background: --kartBg--; scroll-snap-align: start; transition: transform 0.35s ease; }
  .modulex-yorum-portre-ray-kart:hover { transform: translateY(-4px); }
  .modulex-yorum-portre-ray-foto { display: grid; aspect-ratio: 4 / 3.4; overflow: hidden; }
  .modulex-yorum-portre-ray-resim { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
  .modulex-yorum-portre-ray-kart:hover .modulex-yorum-portre-ray-resim { transform: scale(1.05); }
  .modulex-yorum-portre-ray-foto--harf { place-items: center; background: color-mix(in srgb, --accent-- 20%, --kartBg--); }
  .modulex-yorum-portre-ray-dev-harf { color: --accentInk--; font-size: clamp(4rem, 8vw, 6rem); font-weight: 900; letter-spacing: -0.04em; }
  .modulex-yorum-portre-ray-govde { display: grid; align-content: start; gap: 12px; padding: 22px; }
  .modulex-yorum-portre-ray-alinti { line-height: 1.65; }
  .modulex-yorum-portre-ray-yazar { padding-block-start: 12px; border-block-start: 1px solid --cizgi--; }
  .modulex-yorum-portre-ray-kontrol { display: flex; justify-content: flex-end; gap: 10px; margin-block-start: 20px; }
  .modulex-yorum-portre-ray-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: --text--; transition: background-color 0.25s ease, opacity 0.25s ease; }
  .modulex-yorum-portre-ray-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; }
  .modulex-yorum-portre-ray-ok:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 768px) {
    .modulex-yorum-portre-ray-ray { grid-auto-columns: 82%; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-yorum-portre-ray :is(.modulex-yorum-portre-ray-baslik, .modulex-yorum-portre-ray-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-yorum-portre-ray-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-yorum-portre-ray-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-yorum-portre-ray { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-yorum-portre-ray *, .modulex-yorum-portre-ray *::before, .modulex-yorum-portre-ray *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-yorum-portre-ray";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
