<section class="modulex-sss-ana-detay{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sss-ana-detay-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* sss-ana-detay — E-posta istemcisi gibi iki bölmeli okuma: liste hep görünür, cevap geniş alanda (uzun cevaplar için). */
  .modulex-sss-ana-detay { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sss-ana-detay *, .modulex-sss-ana-detay *::before, .modulex-sss-ana-detay *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sss-ana-detay :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sss-ana-detay :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sss-ana-detay :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sss-ana-detay :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sss-ana-detay img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sss-ana-detay) img { height: auto; }
  .modulex-sss-ana-detay [hidden] { display: none !important; }
  .modulex-sss-ana-detay :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sss-ana-detay :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sss-ana-detay-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sss-ana-detay-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sss-ana-detay--bassiz .modulex-sss-ana-detay-bas { display: none; }
  .modulex-sss-ana-detay-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sss-ana-detay-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sss-ana-detay-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sss-ana-detay-bas { max-width: 760px; }
  .modulex-sss-ana-detay-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sss-ana-detay-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sss-ana-detay-dugme:hover { transform: translateY(-2px); }
  .modulex-sss-ana-detay-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sss-ana-detay-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sss-ana-detay-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sss-ana-detay-govde { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: clamp(20px, 4vw, 48px); align-items: start; }
  .modulex-sss-ana-detay:not(.modulex-sss-ana-detay--js) .modulex-sss-ana-detay-liste { display: none; }
  .modulex-sss-ana-detay:not(.modulex-sss-ana-detay--js) .modulex-sss-ana-detay-govde { grid-template-columns: minmax(0, 1fr); }
  .modulex-sss-ana-detay-liste { display: grid; gap: 4px; padding: 6px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; }
  .modulex-sss-ana-detay-sekme { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px; border: 0; border-radius: calc(--yuvarlak-- * 0.6); background: transparent; color: --text--; font: inherit; font-weight: 600; text-align: start; line-height: 1.4; transition: background 0.25s ease, color 0.25s ease; }
  .modulex-sss-ana-detay-sekme:hover { background: --kartBg--; }
  .modulex-sss-ana-detay-sekme[aria-selected="true"] { background: --vurguBg--; color: --vurguText--; }
  .modulex-sss-ana-detay-no { flex: none; color: inherit; font-size: 0.82rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-sss-ana-detay-paneller { display: grid; gap: 16px; }
  .modulex-sss-ana-detay-panel { display: grid; align-content: start; gap: 14px; min-height: 260px; padding: clamp(24px, 4vw, 44px); border-radius: --yuvarlak--; background: --kartBg--; animation: modulex-sss-ana-detay-gel 0.4s ease both; }
  .modulex-sss-ana-detay-ikon { color: --accentInk--; font-size: 34px; }
  .modulex-sss-ana-detay-psoru { font-size: clamp(1.3rem, 2.4vw, 1.75rem); font-weight: 750; line-height: 1.25; }
  .modulex-sss-ana-detay-cevap { color: --muted--; font-size: 1.06rem; line-height: 1.8; }
  @keyframes modulex-sss-ana-detay-gel { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-sss-ana-detay-govde { grid-template-columns: minmax(0, 1fr); }
    .modulex-sss-ana-detay-panel { min-height: 0; }
  }
  .modulex-sss-ana-detay-bag { display: inline-flex; align-items: center; gap: 6px; margin-block-start: 10px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.25s ease; }
  .modulex-sss-ana-detay-bag:hover { gap: 10px; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-sss-ana-detay-bag .material-symbols-outlined { font-size: 18px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-ana-detay :is(.modulex-sss-ana-detay-baslik, .modulex-sss-ana-detay-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-ana-detay-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sss-ana-detay { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sss-ana-detay *, .modulex-sss-ana-detay *::before, .modulex-sss-ana-detay *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sss-ana-detay";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
