<section class="modulex-oz2" id="oz2-{{id}}" style="--oz2-cols:{{oz2cols}}">
  <div class="modulex-oz2-wrap">
    {{oz2head}}
    <ul class="modulex-oz2-grid" aria-label="{{listLabel}}">{{oz2cards}}</ul>
  </div>
</section>

<style>
  /* Özellik Kartları Izgarası (ozellik-zigzag-2). Renkler yalnız desing token'ı. */
  .modulex-oz2 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(40px, 7vw, 88px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-oz2 *, .modulex-oz2 *::before, .modulex-oz2 *::after { box-sizing: border-box; }
  .modulex-oz2 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-oz2-wrap { max-width: --max--; margin-inline: auto; }
  .modulex-oz2-head { max-width: 64ch; margin: 0 auto 40px; text-align: center; }
  .modulex-oz2-eyebrow { margin: 0 0 8px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: --accent--; }
  .modulex-oz2-title { margin: 0 0 10px; font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.4rem); line-height: 1.2; color: --textcolor--; text-wrap: balance; }
  .modulex-oz2-desc { margin: 0; font-size: 1.05rem; line-height: 1.7; color: --mutedcolor--; }

  .modulex-oz2-grid {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(var(--oz2-cols, 3), minmax(0, 1fr)); gap: clamp(16px, 2.4vw, 28px);
  }
  .modulex-oz2-card {
    position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    border-radius: --radius--; background: --surface--; border: 1px solid --bordercolor--;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .modulex-oz2-card:hover, .modulex-oz2-card:focus-within { transform: translateY(-4px); box-shadow: 0 16px 32px color-mix(in srgb, --textcolor-- 14%, transparent); }
  .modulex-oz2-ikon {
    display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin: 28px 28px 0;
    border-radius: 14px; background: --accent--; color: --accentText--;
  }
  .modulex-oz2-ikon .material-symbols-outlined { font-size: 30px; }
  .modulex-oz2-img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; background: --surface2--; }
  .modulex-oz2-govde { display: flex; flex-direction: column; gap: 10px; flex: 1; padding: 20px 28px 28px; }
  .modulex-oz2-h { margin: 0; font-size: 1.2rem; line-height: 1.3; color: --textcolor--; }
  .modulex-oz2 a.modulex-oz2-a, .modulex-oz2 a.modulex-oz2-a:visited { color: inherit; text-decoration: none; }
  /* Kartın tamamı tıklanır: bağlantının ::after'ı kartı kaplar (tek sekme durağı) */
  .modulex-oz2-a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .modulex-oz2-a:focus-visible { outline: none; }
  .modulex-oz2-card:has(.modulex-oz2-a:focus-visible) { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-oz2-p { margin: 0; line-height: 1.7; color: --mutedcolor--; }
  .modulex-oz2-more { display: inline-flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 6px; font-weight: 700; color: --accent--; }
  .modulex-oz2-more .material-symbols-outlined { font-size: 20px; transition: transform 0.2s ease; }
  .modulex-oz2-card:hover .modulex-oz2-more .material-symbols-outlined { transform: translateX(4px); }
  [dir="rtl"] .modulex-oz2-more .material-symbols-outlined { transform: scaleX(-1); }

  @media (max-width: 1024px) { .modulex-oz2-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    .modulex-oz2-grid { grid-template-columns: 1fr; }
    .modulex-oz2-head { text-align: start; margin-bottom: 28px; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-oz2 *, .modulex-oz2 *::before, .modulex-oz2 *::after { animation: none !important; transition: none !important; }
    .modulex-oz2-card:hover, .modulex-oz2-card:focus-within { transform: none; }
  }
</style>
