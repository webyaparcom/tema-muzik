  .modulex-iletisim-dikey-sekme:not(.modulex-iletisim-dikey-sekme--js) .modulex-iletisim-dikey-sekme-panel + .modulex-iletisim-dikey-sekme-panel { margin-block-start: 14px; }
  @keyframes modulex-iletisim-dikey-sekme-gel { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .modulex-iletisim-dikey-sekme-pdeger { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.4rem, 3.2vw, 2.3rem); font-weight: 750; line-height: 1.25; }
  .modulex-iletisim-dikey-sekme-eylemler { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .modulex-iletisim-dikey-sekme-eylemler:empty { display: none; }

  [dir="rtl"] .modulex-iletisim-dikey-sekme-sekme, :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-dikey-sekme-sekme { border-radius: 12px 0 0 12px; }
  @media (max-width: 1024px) {

    .modulex-iletisim-dikey-sekme-sekme { flex: none; border-inline-start: 0; border-block-end: 3px solid --cizgi--; border-radius: 12px 12px 0 0; }
    .modulex-iletisim-dikey-sekme-sekme[aria-selected="true"] { border-block-end-color: --accent--; }
    [dir="rtl"] .modulex-iletisim-dikey-sekme-sekme, :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-dikey-sekme-sekme { border-radius: 12px 12px 0 0; }
  }
  .modulex-iletisim-dikey-sekme-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-dikey-sekme-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-dikey-sekme-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-dikey-sekme-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-dikey-sekme-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-dikey-sekme-eylem:hover { gap: 10px; }
  .modulex-iletisim-dikey-sekme-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-dikey-sekme-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-dikey-sekme--kjs .modulex-iletisim-dikey-sekme-kopya { display: inline-flex; }
  .modulex-iletisim-dikey-sekme-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-dikey-sekme-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-dikey-sekme--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-dikey-sekme-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-dikey-sekme-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-dikey-sekme-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-dikey-sekme-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-dikey-sekme-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-dikey-sekme-cikon { font-size: 18px; }
  .modulex-iletisim-dikey-sekme-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-dikey-sekme-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-dikey-sekme-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-dikey-sekme-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-dikey-sekme-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-dikey-sekme-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-dikey-sekme-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-dikey-sekme :is(.modulex-iletisim-dikey-sekme-baslik, .modulex-iletisim-dikey-sekme-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-dikey-sekme-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-dikey-sekme { padding-inline: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-dikey-sekme *, .modulex-iletisim-dikey-sekme *::before, .modulex-iletisim-dikey-sekme *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-dikey-sekme";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    const kopyala = (s, P) => {
        if (!navigator.clipboard || !navigator.clipboard.writeText) return;
        s.classList.add(P + "--kjs");
        s.querySelectorAll("[data-kopyala]").forEach((b) => {
          const yazi = b.querySelector("." + P + "-kyazi");
          const ilk = yazi ? yazi.textContent : "";
          b.addEventListener("click", () => {
            const bitti = () => {
              b.classList.add(P + "--kopyalandi");
              if (yazi) yazi.textContent = b.dataset.tamam || ilk;
              setTimeout(() => { b.classList.remove(P + "--kopyalandi"); if (yazi) yazi.textContent = ilk; }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.kopyala).then(bitti, () => {});
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
      kopyala(s, P, az);
    });
  })();
</script>
